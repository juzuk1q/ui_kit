name: ui_kit
description: "a."
version: 0.0.3
homepage:

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.8.0
  vize: ^1.0.4
  flutter_svg: ^2.3.0
  modal_bottom_sheet: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
   assets:
     - assets/icons/

   fonts:
     - family: Manrope
       fonts:
         - asset: assets/fonts/Manrope-ExtraLight.ttf
           weight: 200
         - asset: assets/fonts/Manrope-Light.ttf
           weight: 300
         - asset: assets/fonts/Manrope-Regular.ttf
           weight: 400
         - asset: assets/fonts/Manrope-Medium.ttf
           weight: 500
         - asset: assets/fonts/Manrope-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/Manrope-Bold.ttf
           weight: 700
         - asset: assets/fonts/Manrope-ExtraBold.ttf
           weight: 800

